[package]
name = "drs_grooves"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Albion Road Audio"]
homepage = "https://www.albionroadaudio.co.uk"
description = "Albion Road Audio DRS Grooves: rock/indie/grunge/punk/metal MIDI grooves for the DrumGizmo DRS Kit"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
drumlib = { path = "../drumlib" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[features]
standalone = ["nih_plug/standalone"]

[[bin]]
name = "drs_grooves_standalone"
path = "src/main.rs"
required-features = ["standalone"]
